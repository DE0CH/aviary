[package]
name = "pigeon"
description = "pigeon: the app-facing front end (Paseo protocol) of aviary."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aviary-core = { path = "../aviary-core" }
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util.workspace = true
gateway-api = { path = "../gateway-api" }
hermit-api = { path = "../hermit-api" }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
magpie-api = { path = "../magpie-api" }
moka.workspace = true
multer.workspace = true
prometheus-client.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
# the WebSocket library axum's `ws` feature serves with: its error type tells an over-size message apart
tokio-tungstenite.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
aviary-core = { path = "../aviary-core", features = ["testing"] }
aviary-conformance = { path = "../../testing/conformance" }
aviary-fakes = { path = "../../testing/fakes" }
fake-access = { path = "../../testing/fake-access" }

[lints]
workspace = true
