[package]
name = "magpie-import"
description = "The one-off importer into magpie (removed after the switch), and the `magpie` binary while it exists."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The `magpie` binary lives here for the switch window: it links this crate (`magpie import …`, cutover 7.1), and a
# package cannot depend on one that depends on it. When the importer is deleted (cutover 10.5 step 8) `src/main.rs`
# moves back to crates/magpie without the `import` arm.
[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
aviary-core = { path = "../aviary-core" }
aviary-pg = { path = "../aviary-pg" }
axum.workspace = true
http-body-util.workspace = true
magpie = { path = "../magpie" }
magpie-api = { path = "../magpie-api" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
aviary-core = { path = "../aviary-core", features = ["testing"] }
base64.workspace = true
proptest.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
