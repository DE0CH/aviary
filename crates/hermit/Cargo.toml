[package]
name = "hermit"
description = "hermit: sandbox lifecycle (the YYC implementation of the hermit contract)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aviary-core = { path = "../aviary-core" }
aviary-pg = { path = "../aviary-pg" }
axum.workspace = true
chrono-tz.workspace = true
clap.workspace = true
futures-util.workspace = true
gateway-api = { path = "../gateway-api" }
hermit-api = { path = "../hermit-api" }
magpie-api = { path = "../magpie-api" }
prometheus-client.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["fs"] }
# the Kubernetes API client's CA (ops, hermit 18.5)
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
supervisor-api = { path = "../supervisor-api" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# env::test_only for the tests' AVIARY_TEST_DATABASE_URL
aviary-core = { path = "../aviary-core", features = ["testing"] }
aviary-conformance = { path = "../../testing/conformance" }
aviary-fakes = { path = "../../testing/fakes" }

[lints]
workspace = true
