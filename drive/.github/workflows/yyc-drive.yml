# YYC Drive (YYC-DRIVE.md). server: clippy and the server's tests (the real program on a temporary folder).
# page: the page's unit tests. image + index: both in one image for amd64 and arm64, ghcr.io/de0ch/yyc-drive:<sha12>,
# only when both passed.
name: yyc-drive
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: yyc-drive-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  IMAGE: ghcr.io/de0ch/yyc-drive
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: clippy
        working-directory: server
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests
        working-directory: server
        run: cargo test --locked

  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.28.11
      - run: pnpm install --frozen-lockfile
      - name: unit tests
        run: pnpm test:unit run

  # One image per architecture on its own kind of runner (YYC's app nodes are arm64, its other pools amd64), then one
  # tag naming both.
  image:
    needs: [server, page]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  index:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag for both architectures
        run: |
          tag="${GITHUB_SHA::12}"
          docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
          docker buildx imagetools inspect "$IMAGE:$tag" | grep -E "linux/(amd64|arm64)"
          test "$(docker buildx imagetools inspect "$IMAGE:$tag" | grep -cE "Platform: +linux/(amd64|arm64)")" = 2
