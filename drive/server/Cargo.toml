[package]
name = "yyc-drive"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde_json = "1"
percent-encoding = "2"
httpdate = "1"
base64 = "0.22"
mime_guess = "2"

[profile.release]
panic = "abort"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tempfile = "3"
