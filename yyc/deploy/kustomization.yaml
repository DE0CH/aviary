# YYC AI (ai.yyc.deyaochen.com): an instance of the Jarvis 3 chat runtime (DE0CH/jarvis3, docs/CHAT.md). See
# ../README.md. The cluster's Flux applies this folder (Kustomization `yyc-ai`, path ./yyc-ai/deploy, SOPS
# decryption with the cluster's age key).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # the base, pinned to a jarvis3 commit (bump with the image tags below)
  - https://github.com/DE0CH/jarvis3//deploy/chat?ref=cd86d23736c45c48365bc8f460e590b269714fde
  - secrets/web-env.sops.yaml
  - secrets/egress-env.sops.yaml
  - secrets/tools-env.sops.yaml
  - secrets/tunnel.sops.yaml
  - secrets/ghcr-pull.sops.yaml
  # sandboxes in this cluster (provider kubernetes): namespace jarvis-sandbox, RuntimeClass gvisor, PriorityClass sandbox
  - sandbox.yaml
  - secrets/ghcr-pull-sandbox.sops.yaml
# the chat image built by jarvis3's `chat` workflow from that commit (the sandbox image tag is in config.json)
images:
  - name: jarvis3-chat
    newName: ghcr.io/de0ch/jarvis3-chat
    newTag: cd86d23736c4
configMapGenerator:
  - name: jarvis-config
    namespace: jarvis
    files: [config.json, system-prompt.md]
  - name: jarvis-brand
    namespace: jarvis
    files: [logo.svg, logo.png]
# GHCR packages are private: every pod pulls with Secret ghcr-pull (user DE0CH, a read:packages token)
patches:
  # memory request = limit at about 2-4x the measured peak (2026-10-20, memory.peak since start: web 66 Mi, tools 60,
  # egress 45, cloudflared 19; web gets more room for real chats). The apps nodes are cx23s (2.7 GiB allocatable).
  - target: {kind: Deployment, name: web}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 256Mi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 256Mi}
  - target: {kind: Deployment, name: "tools|egress"}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 128Mi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 128Mi}
  - target: {kind: Deployment, name: cloudflared}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 64Mi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 64Mi}
  # 2-replica Deployments roll one pod at a time (the other keeps serving, no extra memory; Deyao, 2026-10-20)
  - target: {kind: Deployment, name: "web|egress|tools|cloudflared"}
    patch: |-
      - {op: replace, path: /spec/strategy/rollingUpdate, value: {maxSurge: 0, maxUnavailable: 1}}
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-pull}]
  # provider e2b: the sandboxes' wire passes Access on egress.ai.yyc.deyaochen.com with service token
  # yyc-ai-sandbox-wire (config sandbox.e2b.egressHeaders); optional until web-env has them
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: EGRESS_WIRE_ACCESS_ID, valueFrom: {secretKeyRef: {name: web-env, key: EGRESS_WIRE_ACCESS_ID, optional: true}}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: EGRESS_WIRE_ACCESS_SECRET, valueFrom: {secretKeyRef: {name: web-env, key: EGRESS_WIRE_ACCESS_SECRET, optional: true}}}
