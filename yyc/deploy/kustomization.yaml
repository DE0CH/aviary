# YYC AI (ai.yyc-internal.com): Claude Code in a sandbox per conversation behind the CloudCLI fork's UI, on the
# Jarvis 3 chat runtime (DE0CH/jarvis3, docs/CHAT.md, docs/CLAUDE-CODE.md). See
# ../README.md. The cluster's Flux applies this folder (Kustomization `yyc-ai`, path ./yyc-ai/deploy). Its Secrets are
# SealedSecrets in ./sealed/, applied by the fenced Kustomization `yyc-ai-secrets` (infra/seal.py, infra/secrets.txt).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # the base, pinned to a jarvis3 commit (bump with the image tags below)
  - https://github.com/DE0CH/jarvis3//deploy/chat?ref=1a378700eaf82687c744b55e9b3fac5467a18a79
  # what is left of the in-cluster sandboxes: the (inert) RuntimeClass gvisor
  - sandbox.yaml
  # the fenced SealedSecret applier may write SealedSecrets in jarvis (./sealed/, Kustomization yyc-ai-secrets)
  - sealed-secrets-rbac.yaml
  # own sandbox hosts (provider vm, jarvis3 docs/SANDBOX-VM.md): overlay routes on the nodes, network policies
  - sandbox-vm.yaml
  # the JuiceFS volume yyc-ai for the Claude Code UI: the CSI driver (kube-system) and the static PV + PVC jarvis/jfs
  - juicefs.yaml
  # the Claude Code UI (CloudCLI fork + router; README "Claude Code UI"): Deployment ui, Services, network policies
  - ui.yaml
  # the operator page reads pod health from the API server (web-to-apiserver NetworkPolicy); the news stream's live
  # dashboard reads the operator snapshot (web-from-news-monitor)
  - ops.yaml
  # egress to YYC's Postgres (namespace db) for every pod
  - db.yaml
# the chat image built by jarvis3's `chat` workflow from that commit (the sandbox image tag is in config.json)
images:
  - name: jarvis3-chat
    newName: ghcr.io/de0ch/jarvis3-chat
    newTag: 1a378700eaf8
  # the UI image, built by DE0CH/claudecodeui's jarvis-image workflow from that fork commit
  - name: yyc-ai-ui
    newName: ghcr.io/de0ch/yyc-ai-ui
    newTag: 140ed04178da
configMapGenerator:
  - name: jarvis-config
    namespace: jarvis
    files: [config.json, system-prompt.md]
# GHCR packages are private: every pod pulls with Secret ghcr-pull (user DE0CH, a read:packages token)
patches:
  # memory request = limit at about 2-4x the measured peak (2026-10-20, memory.peak since start: web 66 Mi, tools 60,
  # cloudflared 19; web gets more room for real chats). The apps nodes are cx23s (2.7 GiB allocatable). egress keeps
  # the base's 256Mi: about 60 Mi idle plus up to 64 MiB of model request bodies held at once (jarvis3 docs/CHAT.md
  # "Memory"); at 128Mi a 7 MB conversation got both egress pods OOM-killed (2026-10-28).
  - target: {kind: Deployment, name: web}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 256Mi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 256Mi}
  # egress injects JARVIS_SENT_FILES_TOKEN on its sent-files route (config.json egress.routes; the UI router's
  # sent-file snapshots, DE0CH/jarvis3 docs/CLAUDE-CODE.md "Sent files")
  - target: {kind: Deployment, name: egress}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: JARVIS_SENT_FILES_TOKEN, valueFrom: {secretKeyRef: {name: egress-env, key: JARVIS_SENT_FILES_TOKEN}}}
  - target: {kind: Deployment, name: tools}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 128Mi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 128Mi}
  - target: {kind: Deployment, name: cloudflared}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 64Mi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 64Mi}
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-pull}]
  # the Secrets' revision: a resealed Secret reaches running pods only through a new pod template, so bump this with
  # every change to a Secret they read (a kubectl rollout restart is undone by Flux). 2026-10-27: the databases moved
  # from Neon to YYC's Postgres (web-env, egress-env, tools-env, ui-env, ui-juicefs); then WEB_FETCH_TOKEN in tools-env;
  # 2026-10-28: ANYAPI_API_KEY in tools-env; JARVIS_SENT_FILES_TOKEN in egress-env and ui-env (bumped twice: the first roll started before the controller had decrypted the new Secrets)
  - target: {kind: Deployment, name: "web|egress|tools|ui"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: any}
      spec: {template: {metadata: {annotations: {yyc/secrets-rev: "2026-10-28-sentfiles-2"}}}}
  # provider vm: sandboxd mTLS (CA, client cert/key, the AWS hosts' server cert/key) and the scaler's AWS key
  # (IAM user yyc-ai-sandbox-scaler), SealedSecret sealed/sandbox-vm.yaml
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value: [{secretRef: {name: sandbox-vm, optional: true}}]
  # provider e2b: the sandboxes' wire passes Access on egress.ai.yyc-internal.com with service token
  # yyc-ai-sandbox-wire (config sandbox.e2b.egressHeaders); optional until web-env has them
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: EGRESS_WIRE_ACCESS_ID, valueFrom: {secretKeyRef: {name: web-env, key: EGRESS_WIRE_ACCESS_ID, optional: true}}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: EGRESS_WIRE_ACCESS_SECRET, valueFrom: {secretKeyRef: {name: web-env, key: EGRESS_WIRE_ACCESS_SECRET, optional: true}}}
  # Claude Code in the sandbox (jarvis3 docs/CLAUDE-CODE.md): the JuiceFS metadata URL + password that web hands to
  # burst hosts in their user data (they mount /var/lib/sbx/jfs); the UI pods' token JARVIS_CC_TOKEN is in the base
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: JARVIS_JUICEFS_META_URL, valueFrom: {secretKeyRef: {name: web-env, key: JARVIS_JUICEFS_META_URL, optional: true}}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: JARVIS_JUICEFS_META_PASSWORD, valueFrom: {secretKeyRef: {name: web-env, key: JARVIS_JUICEFS_META_PASSWORD, optional: true}}}
