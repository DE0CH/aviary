# YYC AI's new stack (aviary: pigeon, magpie, hermit; jarvis3: egress, tools), applied to the new Talos cluster by
# .github/workflows/yyc-ai.yml (yyc-ai/refactor DESIGN 15, spec-platform 9 and 25). Its Secrets are SealedSecrets in
# ./sealed/ (sealed with infra/sealed-secrets-talos.pem), applied by the same workflow's fenced step.
#
# Namespaces yyc-ai and yyc-ai-fabric, the deployer's rights and the JuiceFS CSI driver are cluster-level
# (news-stream/deploy/clusters/talos/, the new cluster's own workflow): never in this render (check items 12-13).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - limits.yaml
  - network.yaml
  - cloudflared.yaml
  - pigeon.yaml
  - magpie.yaml
  - hermit/hermit.yaml
  - hermit/fabric.yaml
  - hermit/juicefs.yaml
  - egress/egress.yaml
  - tools/tools.yaml
  # the cross-cluster bridges' new side (DESIGN 15.5): until A6 (B1, B2) and the apps' T4 moves (B4-B6)
  - bridges.yaml
  # the switch's importers (spec-platform 9.12): CronJobs suspended until A2; deleted in the teardown
  - jobs
  # the switch's one-shot Jobs (A2's plan, bulk import, holds, parity; hermit-jfs-owner in A2 and A6) are not here: a
  # Job's image is immutable, so each re-pin of the tags below would refuse them; they run from yyc-ai/oneshot/ with
  # oneshot/run.sh, on the images pinned here, outside the inventory
# one aviary commit for pigeon, magpie, hermit and sandboxd (check item 4); sandboxd's tag is hermit.json's
# fabric.sandboxd; the sandbox image is pinned by digest in hermit/hermit.json
images:
  - {name: pigeon, newName: ghcr.io/de0ch/pigeon, newTag: "300a3adb8dfc"}
  - {name: magpie, newName: ghcr.io/de0ch/magpie, newTag: "300a3adb8dfc"}
  - {name: hermit, newName: ghcr.io/de0ch/hermit, newTag: "300a3adb8dfc"}
  - {name: sandboxd, newName: ghcr.io/de0ch/sandboxd, newTag: "300a3adb8dfc"}
  # the app bundle (DE0CH/claudecodeui pigeon-app.yml); from A1 to A5 only a pigeon-app-fix/* build may replace it
  # (DESIGN 9.6, cutover freeze-check)
  - {name: pigeon-app, newName: ghcr.io/de0ch/pigeon-app, newTag: "29d74efa687f"}
  # egress and tools (DE0CH/jarvis3 chat.yml); the ZDR guard reads this tag (yyc-ai/tests/test_zdr.py)
  - {name: jarvis3-chat, newName: ghcr.io/de0ch/jarvis3-chat, newTag: "92aa7c62d2bf"}
configMapGenerator:
  # hermit's YYC configuration (hermit spec 9): hashed, so a change rolls hermit
  - name: hermit-config
    namespace: yyc-ai
    files: [hermit/hermit.json, hermit/system-prompt.md, hermit/sandbox-rules.md, hermit/title-system.md]
  # who may use YYC AI, and admins (hermit 3.4.1): a fixed name, so hermit and tools see a change in place (no roll)
  # the managed skills (decision 15; hermit's prompt.skills, the descriptor's claude.managedSkills): hermit/skills/<skill>/
  # <file> as key <skill>.<file>, mounted back at <skill>/<file> by hermit.yaml's items (check_deploy.py item K keeps the
  # three lists equal); hashed, so a change rolls hermit and new sandboxes get it
  - name: hermit-skills
    namespace: yyc-ai
    files:
      - labels.SKILL.md=hermit/skills/labels/SKILL.md
      - newswatch.SKILL.md=hermit/skills/newswatch/SKILL.md
      - schedules.SKILL.md=hermit/skills/schedules/SKILL.md
      - web.SKILL.md=hermit/skills/web/SKILL.md
  - name: catalogue
    namespace: yyc-ai
    files: [catalogue.json]
    options: {disableNameSuffixHash: true}
  # the gateway's host.json (hermit 14.2): hashed, so a change rolls the gateway pod (the data plane stays, HOST.md)
  - name: hermit-gateway
    namespace: yyc-ai-fabric
    files: [hermit/gateway-host.json]
  - name: egress-config
    namespace: yyc-ai
    files: [egress/egress.json]
  - name: tools-config
    namespace: yyc-ai
    files: [tools/tools.json]
  # the old cluster's API CA for magpie-import (bridge B7), a copy of infra/yyc-cluster-ca.pem kept byte-identical by
  # yyc-ai.yml's check (kustomize loads no file outside this folder); until A6
  - name: legacy-kube-ca
    namespace: yyc-ai
    files: [ca.crt=legacy-kube-ca.crt]
patches:
  # the Secrets' revision, per Deployment (gap-2 2.15): a resealed Secret reaches running pods only through a new pod
  # template, so bump the value for the readers of that Secret only
  - target: {kind: Deployment, name: pigeon}
    patch: '[{"op": "add", "path": "/spec/template/metadata/annotations", "value": {"yyc/secrets-rev": "initial"}}]'
  - target: {kind: Deployment, name: magpie}
    patch: '[{"op": "add", "path": "/spec/template/metadata/annotations", "value": {"yyc/secrets-rev": "initial"}}]'
  - target: {kind: Deployment, name: hermit}
    patch: '[{"op": "add", "path": "/spec/template/metadata/annotations", "value": {"yyc/secrets-rev": "initial"}}]'
  - target: {kind: Deployment, name: egress}
    patch: '[{"op": "add", "path": "/spec/template/metadata/annotations", "value": {"yyc/secrets-rev": "initial"}}]'
  - target: {kind: Deployment, name: tools}
    patch: '[{"op": "add", "path": "/spec/template/metadata/annotations", "value": {"yyc/secrets-rev": "initial"}}]'
  - target: {kind: Deployment, name: cloudflared}
    patch: '[{"op": "add", "path": "/spec/template/metadata/annotations", "value": {"yyc/secrets-rev": "initial"}}]'
