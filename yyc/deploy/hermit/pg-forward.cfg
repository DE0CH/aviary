# pg-forward (pg-forward.yaml): TCP only, one listener, one server. Nothing here reads a byte of the database's
# protocol: TLS and the role's password are between the client and Postgres.
global
    log stdout format raw local0 notice
    maxconn 2000
    # after the stop signal no new connection is taken; open ones may finish for this long
    hard-stop-after 30s

defaults
    mode tcp
    log global
    timeout connect 5s
    # an idle metadata connection is closed by its JuiceFS client after 5 min; nothing here closes one sooner
    timeout client 30m
    timeout server 30m
    option clitcpka
    option srvtcpka

resolvers kube
    parse-resolv-conf
    hold valid 30s

listen pg
    bind :5432
    # the Service's cluster address (it follows Cluster pg's primary); resolved again if it ever changes
    server pg pg-shared.db.svc.cluster.local:5432 resolvers kube init-addr libc,none
