# hermit's /jfs (hermit spec 15.2, spec-platform 9.6): a static PV for the existing JuiceFS volume yyc-ai (metadata
# jfs_yyc_ai on Cluster pg, reached through db/pg-shared). Its own volumeHandle gives it its own mount pods (the JuiceFS
# CSI driver, news-stream/deploy/clusters/talos/addons/juicefs-csi.values.yaml). Everything under ws/ is uid/gid 1000 (hermit 15.4).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermit-jfs
  labels: {juicefs-volume: yyc-ai-hermit}
spec:
  capacity: {storage: 1Pi}
  volumeMode: Filesystem
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: csi.juicefs.com
    volumeHandle: yyc-ai-hermit
    fsType: juicefs
    nodePublishSecretRef: {name: hermit-juicefs, namespace: yyc-ai}
  mountOptions: [cache-size=0, open-cache=0, all-squash=1000:1000]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermit-jfs
  namespace: yyc-ai
spec:
  accessModes: [ReadWriteMany]
  volumeMode: Filesystem
  resources: {requests: {storage: 1Pi}}
  storageClassName: ""
  selector:
    matchLabels: {juicefs-volume: yyc-ai-hermit}
