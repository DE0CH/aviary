[workspace]
resolver = "3"
members = [
  "crates/*",
  "testing/fakes",
  "testing/mock-model",
  "testing/fake-tools",
  "testing/test-gateway",
  "testing/fake-sandboxd",
  "testing/fake-access",
  "testing/conformance",
  "testing/e2e",
  "testing/source-rules",
  "testing/tls-canary",
]
# throwaway spikes are their own workspaces (crates/supervisor/GATE.md)
exclude = ["crates/supervisor/spikes"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/DE0CH/aviary"
publish = false

[workspace.lints.rust]
# crates/supervisor (FUSE, fd passing) and crates/sandboxd allow it per module with #[allow(unsafe_code)] and a
# // SAFETY: comment on every block
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny" # tests may allow it (clippy.toml allow-unwrap-in-tests)
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny" # logs go through tracing; CLIs use a dedicated writer

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort" # a panic ends the process; Kubernetes or the keeper restarts it

# sandboxd's release build (crates/sandboxd/docs/MEMORY.md): its own settings as in jarvis3, built with
# `--profile sandboxd`. It must unwind: a bug in one request is caught (catch_unwind) and answered by closing that
# connection, never by ending the daemon. `panic` cannot be set per package, hence a profile.
[profile.sandboxd]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
debug = false

# Exact pins, once. Crates write `tokio.workspace = true` and may add features on top.
[workspace.dependencies]
tokio = { version = "=1.54.1", features = ["full"] }
axum = "=0.8.9"
hyper = "=1.12.0"
tower = "=0.5.3"
tower-http = "=0.7.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# the system trust store for outbound HTTPS; honours SSL_CERT_FILE (platform 3.9)
rustls-native-certs = "=0.8.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1", "with-time-0_3", "with-serde_json-1"] }
tokio-postgres-rustls = "=0.14.0"
deadpool-postgres = "=0.14.2"
postgres-types = { version = "=0.2.14", features = ["derive", "with-uuid-1", "with-time-0_3", "with-serde_json-1"] }
uuid = { version = "=1.29.0", features = ["v4", "v7", "serde"] }
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
chrono-tz = "=0.10.4"
tracing = "=0.1.44"
# env-filter off: levels are compiled-in defaults (platform 4.3)
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }
prometheus-client = "=0.25.2"
ring = "=0.17.14"
subtle = "=2.6.1"
base64 = "=0.23.1"
sha2 = "=0.11.1"
moka = { version = "=0.12.16", features = ["future"] }
aws-config = { version = "=1.13.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "=1.157.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-ec2 = { version = "=1.274.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# the SDKs' HTTPS client: rustls on ring, hyper 1 (`rustls-ring`; the default `rustls-aws-lc` would add aws-lc-sys).
# Crates using the SDK pass `Builder::new().tls_provider(Rustls(Ring)).build_https()` as `http_client`, as in
# testing/tls-canary.
aws-smithy-http-client = { version = "=1.5.2", default-features = false, features = ["rustls-ring", "rt-tokio"] }
kube = { version = "=5.0.0", default-features = false, features = ["client", "runtime", "ws", "rustls-tls", "ring"] }
k8s-openapi = { version = "=0.29.0", features = ["v1_36"] }
image = "=0.25.10"
fast_image_resize = "=6.1.0"
libheif-rs = "=3.0.0"
webp = "=0.3.1"
kamadak-exif = "=0.6.1"
multer = "=3.1.0"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
x25519-dalek = "=3.0.0"
rustix = "=1.1.6"
nix = "=0.31.3"
thiserror = "=2.0.21"
# sandboxd (crates/sandboxd/docs/MEMORY.md): raw syscalls without a heap, and the free-list heap inside its arenas
libc = { version = "=0.2.191", default-features = false }
linked_list_allocator = { version = "=0.10.6", default-features = false }
anyhow = "=1.0.104" # bins only
clap = { version = "=4.6.7", features = ["derive"] }
# dev
proptest = "=1.12.0"
insta = { version = "=1.49.0", features = ["json"] }
