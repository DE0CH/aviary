# gitleaks configuration: the default rules, plus the files that hold published test values by design.
[extend]
useDefault = true

[[allowlists]]
description = "hermit-api's token known-answer vector: tokens derived from a fixed all-0x07 test key, published in docs/CONTRACTS.md"
paths = ['''^crates/hermit-api/vectors/token-v1\.json$''']

[[allowlists]]
description = "fake-access's PEM parser in this commit matched the PEM header literal and the code after it as a key; it holds no key (the parser now uses rustls-pki-types and has no such literal)"
commits = ["a07f6b403123f2acae4118a55ee849fef434f50a"]
