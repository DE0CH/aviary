# The iPhone walk's list (scripts/ios-app/simulator-walk.mjs), right after walk-sign-in.yaml (no relaunch: the simulator
# build is unsigned, so the Keychain refuses the token and it lives only in the running app): open the
# conversation list, a long press on a plain and on a pinned conversation opens its menu, then the conversation with
# tasks.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "menu-button"
    timeout: 90000
- tapOn:
    id: "menu-button"
- extendedWaitUntil:
    visible: "${PLAIN}"
    timeout: 30000
- takeScreenshot: list
- longPressOn: "${PLAIN}"
- extendedWaitUntil:
    visible:
      id: "sidebar-workspace-context-menu-.*"
    timeout: 10000
- takeScreenshot: plain-menu
# the menu's backdrop covers the screen; a tap on its left edge, below the status bar (which iOS keeps for itself)
# and beside any menu (they open at the row's right), closes it
- tapOn:
    point: "10%,50%"
- extendedWaitUntil:
    notVisible:
      id: "sidebar-workspace-context-menu-.*"
    timeout: 10000
- longPressOn: "${PINNED}"
- extendedWaitUntil:
    visible:
      id: "sidebar-workspace-context-menu-.*"
    timeout: 10000
- takeScreenshot: pinned-menu
# the menu's backdrop covers the screen; a tap on its left edge, below the status bar (which iOS keeps for itself)
# and beside any menu (they open at the row's right), closes it
- tapOn:
    point: "10%,50%"
- extendedWaitUntil:
    notVisible:
      id: "sidebar-workspace-context-menu-.*"
    timeout: 10000
- tapOn: "${TASKS}"
- extendedWaitUntil:
    visible:
      id: "activity-chip"
    timeout: 30000
- takeScreenshot: tasks-conversation
