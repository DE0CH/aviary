# The iPhone walk's sign-in (scripts/ios-app/simulator-walk.mjs), against the stand-in for pigeon: iOS's prompt for the
# server, Continue, and the stand-in answers the sign-in straight back to the app. Safe to run again: an app already
# signed in (an earlier attempt that got as far as the token) skips to its conversation list's button.
appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "yyc-sign-in|menu-button"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "yyc-sign-in"
    commands:
      - tapOn:
          id: "yyc-sign-in"
      - extendedWaitUntil:
          visible: ".*Wants to Use.*"
          timeout: 30000
      - tapOn: "Continue"
- extendedWaitUntil:
    visible:
      id: "menu-button"
    timeout: 90000
