# cargo-deny (platform 4.1, 4.5, 4.6). `cargo deny check` runs in ci.yml's lint job.

[graph]
all-features = false
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]

[advisories]
# every advisory fails the build (yanked crates too); an exception needs an `ignore` entry with a reason
yanked = "deny"
ignore = []

[licenses]
# only licences compatible with AGPL-3.0-or-later (platform 4.6). No "-only" GPL family licence: a dependency under
# AGPL-3.0-only or GPL-3.0-only would fix the combined work at version 3 and drop the "or later" option.
allow = [
  "AGPL-3.0-or-later",
  "GPL-3.0-or-later",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # one version each of the async/TLS stack (platform 4.1)
  { crate = "tokio", deny-multiple-versions = true },
  { crate = "hyper", deny-multiple-versions = true },
  { crate = "rustls", deny-multiple-versions = true },
  # platform 4.5's dependency ban (EC2 and Kubernetes clients only in hermit and the harness) is deny-hermit-only.toml,
  # checked with those crates excluded: wrappers here would warn "unmatched wrapper" whenever a wrapper or the banned
  # crate is absent from the graph, burying real warnings.
  # no OpenSSL anywhere: rustls only, and musl builds have no C TLS library
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "native-tls", reason = "rustls only" },
  # ring is the one crypto provider (rustls, kube, the AWS SDK's HTTP client via aws-smithy-http-client rustls-ring)
  { crate = "aws-lc-rs", reason = "ring only" },
  { crate = "aws-lc-sys", reason = "ring only" },
  { crate = "aws-lc-fips-sys", reason = "ring only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
