# DE0CH fork: build the CLI as upstream publishes it to npm and release the tarball as de0ch-<sha12>, with its
# sha256. aviary's sandbox image installs it pinned by that sha256 (de0ch/README.md). Upstream's own workflows do not
# run in this fork (Actions are enabled for this workflow only).
name: de0ch-release
on:
  push:
    branches: [de0ch]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: de0ch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # corepack fetches the pinned pnpm without asking (a prompt nobody answers hangs the job)
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: the test of what this fork changes
        working-directory: packages/core
        run: corepack pnpm exec vitest run src/core/openaiContentGenerator/converter.test.ts src/core/openaiContentGenerator/media-budget.test.ts src/core/upstream-refusal.test.ts src/utils/runtimeFetchOptions.test.ts src/telemetry/qwen-logger/no-usage-statistics.test.ts src/services/backgroundShellRegistry.test.ts src/tools/shell.test.ts
      - name: an assistant record takes the uuid reserved for it
        working-directory: packages/core
        run: corepack pnpm exec vitest run src/services/chatRecordingService.test.ts -t "de0ch"
      - name: the chat rolls back after a refusal
        working-directory: packages/core
        run: corepack pnpm exec vitest run src/core/llm-chat.test.ts -t "DE0CH fork"
      - name: the test of what this fork changes in the CLI
        working-directory: packages/cli
        run: corepack pnpm exec vitest run src/nonInteractive/control/controllers/permissionController.test.ts src/nonInteractive/control/controllers/systemController.test.ts src/nonInteractive/control/ControlDispatcher.test.ts src/nonInteractive/session.test.ts src/nonInteractive/io/StreamJsonOutputAdapter.recordIdentity.test.ts src/nonInteractive/io/StreamJsonOutputAdapter.test.ts src/nonInteractive/io/StreamJsonOutputAdapter.dualOutput.test.ts
      - name: build, bundle, pack
        run: |
          npm run build
          npm run bundle
          npm run prepare:package
          cd dist
          npm pack
          mv qwen-code-qwen-code-*.tgz ../qwen-code-de0ch.tgz
      - name: the packed CLI names no usage statistics endpoint
        run: |
          mkdir "$RUNNER_TEMP/packed" && tar -xzf qwen-code-de0ch.tgz -C "$RUNNER_TEMP/packed"
          if grep -rlE 'rum\.aliyuncs\.com' "$RUNNER_TEMP/packed"; then
            echo "the usage statistics upload is back (de0ch/README.md)"; exit 1
          fi
      - name: the packed CLI installs and starts
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/qwen" -g ./qwen-code-de0ch.tgz
          "$RUNNER_TEMP/qwen/bin/qwen" --version
      - name: the packed CLI reports background shells and monitors to its host
        run: node de0ch/background-tasks.e2e.mjs "$RUNNER_TEMP/qwen/bin/qwen"
      - name: the packed CLI goes on after its provider refuses a video
        run: node de0ch/upstream-refusal.e2e.mjs "$RUNNER_TEMP/qwen/bin/qwen"
      - name: the packed CLI goes on from a turn that was cut off when its host asks
        run: node de0ch/continue-last-turn.e2e.mjs "$RUNNER_TEMP/qwen/bin/qwen"
      - name: the packed CLI's stream names a reply as its transcript records it
        run: node de0ch/stream-record-ids.e2e.mjs "$RUNNER_TEMP/qwen/bin/qwen"
      - name: the packed CLI names the thinking level its host set, "none" included
        run: node de0ch/thinking-level.e2e.mjs "$RUNNER_TEMP/qwen/bin/qwen"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="de0ch-$(git rev-parse --short=12 HEAD)"
          sha=$(sha256sum qwen-code-de0ch.tgz | cut -d' ' -f1)
          printf '%s  qwen-code-de0ch.tgz\n' "$sha" > qwen-code-de0ch.tgz.sha256
          gh release create "$tag" qwen-code-de0ch.tgz qwen-code-de0ch.tgz.sha256 \
            --target "$GITHUB_SHA" --title "$tag" \
            --notes "Qwen Code $(node -p "require('./package.json').version") + DE0CH changes (de0ch/README.md). sha256 $sha"
