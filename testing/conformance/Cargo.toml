[package]
name = "aviary-conformance"
description = "aviary-conformance: the hermit, gateway and model conformance suites."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aviary-conformance"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aviary-core = { path = "../../crates/aviary-core" }
aviary-fakes = { path = "../fakes" }
axum.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
gateway-api = { path = "../../crates/gateway-api" }
hermit-api = { path = "../../crates/hermit-api" }
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
mock-model = { path = "../mock-model" }
prometheus-client.workspace = true
test-gateway = { path = "../test-gateway" }

[lints]
workspace = true
