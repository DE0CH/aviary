# The switch window's pieces in the new cluster (testing/e2e's aviary-e2e namespace): the bridge Services of DESIGN
# 15.5 (ui-legacy for B1, pigeon-bridge as B2's target), the importer's Secret, CA and hand-over Deployment, and the
# NetworkPolicies that let exactly these through the harness's default deny. run.sh fills the __PLACEHOLDERS__.
apiVersion: v1
kind: Service
metadata: {name: ui-legacy, namespace: aviary-e2e}
spec:
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Endpoints
metadata: {name: ui-legacy, namespace: aviary-e2e}
subsets:
  - addresses: [{ip: __BRIDGE_IP__}]
    ports: [{name: http, port: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: pigeon-bridge, namespace: aviary-e2e}
spec:
  type: NodePort
  selector: {app: pigeon}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30081}]
---
apiVersion: v1
kind: Secret
metadata: {name: magpie-import, namespace: aviary-e2e}
type: Opaque
stringData:
  MAGPIE_IMPORT_CLOUDCLI_URL: "__CLOUDCLI_DB__"
  MAGPIE_IMPORT_JARVIS_URL: "__JARVIS_DB__"
  MAGPIE_IMPORT_TOKEN_UI: "__SWITCH__"
  MAGPIE_IMPORT_LEGACY_KUBE_URL: "https://__OLD_API__:6443"
  MAGPIE_IMPORT_LEGACY_KUBE_TOKEN: "__KUBE_TOKEN__"
  MAGPIE_IMPORT_ACCEPT_MAGPIE: "__ACCEPT_MAGPIE__"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: legacy-kube-ca, namespace: aviary-e2e}
data:
  ca.crt: |
__KUBE_CA__
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: magpie-import, namespace: aviary-e2e}
spec:
  replicas: 2
  selector: {matchLabels: {app: import}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata: {labels: {app: import}}
    spec:
      serviceAccountName: plain
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: magpie-import
          image: aviary-e2e/magpie:e2e
          imagePullPolicy: Never
          args: [import, handover]
          envFrom: [{secretRef: {name: magpie-env}}, {secretRef: {name: magpie-import}}]
          env: [{name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}]
          ports: [{containerPort: 9090}]
          readinessProbe: {httpGet: {path: /readyz, port: 9090}, periodSeconds: 3}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: jfs, mountPath: /jfs, readOnly: true, mountPropagation: HostToContainer}
            - {name: legacy-kube-ca, mountPath: /etc/legacy-kube-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: export-server
          image: aviary-e2e/magpie:e2e
          imagePullPolicy: Never
          args: [import, export-server]
          envFrom: [{secretRef: {name: magpie-env}}, {secretRef: {name: magpie-import}}]
          env: [{name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 3}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: jfs, mountPath: /jfs, mountPropagation: HostToContainer}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: jfs, hostPath: {path: __JFS__, type: Directory}}
        - {name: legacy-kube-ca, configMap: {name: legacy-kube-ca}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: magpie-import, namespace: aviary-e2e}
spec:
  selector: {app: import}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
# pigeon -> the bridge (B1); the bridge and the edge stand-in -> pigeon (B2, the persona tabs after the flip)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: legacy-pigeon, namespace: aviary-e2e}
spec:
  podSelector: {matchLabels: {app: pigeon}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ipBlock: {cidr: __SUBNET__}}]
      ports: [{port: 8080}]
  egress:
    - to: [{ipBlock: {cidr: __BRIDGE_IP__/32}}]
      ports: [{port: 8080}]
---
# magpie -> the importer's synchronous ingest; the importer -> magpie's database and bucket, the old databases, the
# old API (B7)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: legacy-import, namespace: aviary-e2e}
spec:
  podSelector: {matchLabels: {app: import}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: magpie}}}]
      ports: [{port: 8080}]
  egress:
    - to: [{ipBlock: {cidr: __SUBNET__}}]
      ports: [{port: 5432}, {port: 9000}, {port: 6443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: legacy-magpie, namespace: aviary-e2e}
spec:
  podSelector: {matchLabels: {app: magpie}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: import}}}]
      ports: [{port: 8080}]
