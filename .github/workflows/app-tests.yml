# The staff UI (app/, docs/paseo-ui.md): typecheck and every test suite of app/packages (the app's unit and browser
# projects, protocol, client, relay, highlight, plugin), on every push touching it. YYC AI is test-first (claude-env
# yyc-ai skill): app.yml and app-ios.yml call this workflow and build only after it passes.
name: app-tests

on:
  push:  # every branch: the gate waits for it
    branches: ['**']
    paths: ["app/**", ".github/workflows/app-tests.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      # the commit to test, when a caller tests another than its own (app.yml called by deploy.yml)
      sha: {type: string, required: false, default: ""}

concurrency:
  # called from app.yml or app-ios.yml, github.workflow is the caller's name: each caller's copy has its own group
  group: ${{ github.workflow }}-tests-${{ inputs.sha && format('deploy-{0}', inputs.sha) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  # a newer push to the same branch cancels this run (it carries this workflow's result for the branch); main's runs all
  # finish (they build what the deploy ships)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.sha || github.sha }}"}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm ci
      - run: npm run build:app-deps
      - name: Typecheck the app
        run: npx tsgo --noEmit -p packages/app/tsconfig.json
      - name: Chromium for the browser tests
        # a download: tried again, each try at most 5 min (main's app run 2026-11-26 hung 38 min in one and the job's
        # 45 min limit cancelled it, so the web app's image was never built and every deploy stopped on it)
        run: |
          for try in 1 2 3 4 5; do
            timeout -k 10 300 npx playwright install --with-deps chromium && exit 0
            echo "::warning title=playwright install::try $try of 5 failed or passed 5 min"
          done
          exit 1
      - name: App tests (unit and browser)
        working-directory: app/packages/app
        run: npx vitest run
      - name: Protocol, client, relay, highlight and plugin tests
        if: success() || failure()   # every suite reports, not only the first red one
        run: |
          set -e
          for p in protocol client relay highlight plugin; do
            echo "::group::$p"; (cd "packages/$p" && npx vitest run); echo "::endgroup::"
          done
