# platform spec 6.1. Jobs still to come with their packages: images, sandbox-smoke, gvisor, e2e, publish (main only,
# needs every gate). Actions are pinned by commit SHA (6.3).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: toolchain (rust-toolchain.toml, exactly)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: libheif (magpie's HEIF/AVIF decoder; ubuntu 24.04's 1.17 is libheif-rs's minimum, feature v1_17)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libheif-dev
      - name: gitleaks 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: no network call inside aviary_pg::tx! (platform 4.3; the macro denies the lint inside its closure)
        run: |
          cargo run --locked -q -p aviary-source-rules --bin tx-rule-conf -- target/tx-rule
          CLIPPY_CONF_DIR=target/tx-rule cargo clippy --workspace --all-targets --locked -- -A clippy::disallowed_methods -D warnings
      - run: cargo deny --locked check
      - name: cargo deny, EC2 and Kubernetes clients only in hermit and the harness (platform 4.5)
        run: cargo deny --locked --config deny-hermit-only.toml --exclude hermit --exclude fake-sandboxd --exclude aviary-e2e check bans
      - run: cargo audit --deny warnings
      - run: gitleaks git --redact --verbose .
      - name: source rules (platform 4.5)
        run: cargo test --locked -p aviary-source-rules
      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          files=(.github/ci/*.sh fabric/**/*.sh images/sandbox/*.sh testing/paseo-contract/**/*.sh crates/hermit/scripts/*.sh)
          shellcheck "${files[@]}"
      - name: fabric/aws/infra.sh against a stand-in aws (every value from the config)
        run: bash fabric/aws/test-infra.sh

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain (rust-toolchain.toml, exactly)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest@0.9.150
      - name: libheif with its HEVC decoder (magpie's HEIC uploads and previews)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libheif-dev libheif-plugin-libde265
      - name: postgres (the production version, TLS on)
        # the digest production's Cluster db/pg runs (the tag is rebuilt upstream)
        run: |
          url=$(.github/ci/postgres.sh ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3 5432)
          echo "::add-mask::$url"
          echo "AVIARY_TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: s3 (versitygw v1.9.0; MinIO publishes no images any more, see .github/ci/s3.sh)
        run: |
          lines=$(.github/ci/s3.sh versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7 9000)
          echo "::add-mask::$(grep '^AVIARY_TEST_S3_SECRET_ACCESS_KEY=' <<< "$lines" | cut -d= -f2-)"
          echo "$lines" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - name: supervisor as root (dockerd spawned as uid 0, daemon.json, the _ping wait; a kernel FUSE mount; the job runs as a user)
        run: |
          bin=$(cargo test --locked -p supervisor --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.kind == ["lib"]) | .executable')
          sudo "$bin" --exact docker::tests::start_spawns_once_and_waits_for_ping --nocapture 2>&1 | tee "$RUNNER_TEMP/root.log"
          grep -q 'dockerd spawned as root and answered _ping' "$RUNNER_TEMP/root.log"
          grep -q '1 passed' "$RUNNER_TEMP/root.log"
          # ~/.claude over the kernel's /dev/fuse: mount(2) with supervisor 2's options, real syscalls on both scopes
          sudo "$bin" --exact fuse::tests::a_kernel_mount_serves_real_syscalls --nocapture 2>&1 | tee "$RUNNER_TEMP/fuse.log"
          grep -q 'kernel fuse mount served real syscalls' "$RUNNER_TEMP/fuse.log"
          grep -q '1 passed' "$RUNNER_TEMP/fuse.log"

  magpie-perf:
    # magpie 6.10 / WP-12: cc write latency with synchronous replication (a primary and a synchronous standby, fsync
    # on), measured with a release build (thin LTO off and more codegen units, to keep the build short)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain (rust-toolchain.toml, exactly)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: postgres, synchronously replicated (the production version, TLS on)
        run: |
          url=$(.github/ci/postgres-sync.sh ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3 5432)
          echo "::add-mask::$url"
          echo "AVIARY_TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: libheif (magpie's HEIF/AVIF decoder)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libheif-dev
      - name: s3 (every magpie replica has a bucket; versitygw as in the test job)
        run: |
          lines=$(.github/ci/s3.sh versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7 9000)
          echo "::add-mask::$(grep '^AVIARY_TEST_S3_SECRET_ACCESS_KEY=' <<< "$lines" | cut -d= -f2-)"
          echo "$lines" >> "$GITHUB_ENV"
      - name: p50 <= 15 ms for a 10 KiB append, p99 <= 150 ms for a 1 MiB image line, an 87 MB read under 5 s
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release --locked -p magpie --test ccfs_perf -- --ignored --nocapture --test-threads=1
      - name: four 40 MP image uploads at once stay under 1 GiB of RSS (magpie 18.2's pod limit)
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release --locked -p magpie --test uploads_perf -- --ignored --nocapture

  sandboxd-soak:
    # hermit spec 14.6: two daemons with stand-ins for runsc/ip/nft/wg, every endpoint, a migration, hostile clients,
    # RSS flat and under the budget; then every answer of the functional part parsed as sandboxd-api's types
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain (rust-toolchain.toml, exactly)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: musl C compiler
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools
      - name: sandboxd (static musl, profile sandboxd)
        run: cargo build --profile sandboxd --locked --target x86_64-unknown-linux-musl -p sandboxd
      - name: soak (45 s)
        run: |
          sudo -E env PATH="$PATH" python3 crates/sandboxd/tests/soak.py \
            target/x86_64-unknown-linux-musl/sandboxd/sandboxd --seconds 45 --dump "$RUNNER_TEMP/sandboxd-dump"
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/sandboxd-dump"
      - name: the daemon's answers against sandboxd-api
        run: SANDBOXD_DUMP="$RUNNER_TEMP/sandboxd-dump" cargo test --locked -p sandboxd-api --test live -- --ignored

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AVIARY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain (rust-toolchain.toml, exactly)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: musl C compiler (cc-rs builds ring's C with it; .cargo/config.toml sets CC_x86_64_unknown_linux_musl)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools
      - name: musl canary (rustls/ring, reqwest, tokio-postgres-rustls, AWS SDK client; linked static and run)
        run: cargo test --locked --target x86_64-unknown-linux-musl -p aviary-tls-canary --lib
      - name: musl binaries (rust-lld, static)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo build --release --locked --target x86_64-unknown-linux-musl --workspace --exclude magpie --exclude sandboxd --bins
          mkdir -p dist
          find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f -executable -exec cp {} dist/ \;
      - name: sandboxd (static musl, its own profile, crates/sandboxd/docs/MEMORY.md)
        # profile `sandboxd` unwinds on panic (one request's bug closes that connection only); the workspace release
        # profile aborts, so sandboxd is never built with it
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo build --profile sandboxd --locked --target x86_64-unknown-linux-musl -p sandboxd
          b=target/x86_64-unknown-linux-musl/sandboxd/sandboxd
          file "$b" | tee /dev/stderr | grep -q "static"
          "$b" --version
          "$b" budget
          # check-config (gateway.sh's check before it installs): a gateway's host.json passes, one whose wgAddress is
          # outside hostCidr is refused (placeholder ranges)
          g='{"name":"gw","role":"hub","gateway":true,"wgAddress":"10.99.0.1","hostCidr":"10.99.0.0/24","controlCidr":"10.97.0.0/16","sandboxCidr":"10.98.0.0/16","egressVip":"10.99.1.1","privateGateway":"10.97.0.1","podCidr":"10.96.0.0/16","reserveMemory":0}'
          printf '%s' "$g" > "$RUNNER_TEMP/gw.json"
          "$b" check-config "$RUNNER_TEMP/gw.json"
          printf '%s' "$g" | sed 's/"wgAddress":"10.99.0.1"/"wgAddress":"10.95.0.1"/' > "$RUNNER_TEMP/gw-bad.json"
          if "$b" check-config "$RUNNER_TEMP/gw-bad.json"; then echo "a wgAddress outside hostCidr passed" >&2; exit 1; fi
          cp "$b" dist/
      - name: images/sandboxd (the gateway installer; built and run here, pushing is the images job's)
        # a context of just the two files the Dockerfile copies (the checkout's target/ would make it gigabytes)
        run: |
          ctx=$RUNNER_TEMP/sandboxd-image
          mkdir -p "$ctx/dist" "$ctx/fabric/host"
          cp dist/sandboxd "$ctx/dist/"
          cp fabric/host/gateway.sh "$ctx/fabric/host/"
          docker build -f images/sandboxd/Dockerfile --build-arg REVISION="$GITHUB_SHA" -t sandboxd-installer:ci "$ctx"
          docker run --rm sandboxd-installer:ci /opt/hermit-gateway/sandboxd --version
          docker run --rm sandboxd-installer:ci sh -c '/opt/hermit-gateway/crane version && /opt/hermit-gateway/jq --version && test -x /opt/hermit-gateway/gateway.sh'
      - name: images/aviary-testing (the testing binaries; built and run here, pushing is the images job's)
        run: |
          ctx=$RUNNER_TEMP/aviary-testing-image
          mkdir -p "$ctx/dist"
          cp dist/aviary-conformance dist/test-gateway dist/mock-model dist/fake-tools dist/fake-access dist/fake-sandboxd "$ctx/dist/"
          docker build -f images/aviary-testing/Dockerfile --build-arg REVISION="$GITHUB_SHA" -t aviary-testing:ci "$ctx"
          docker run --rm aviary-testing:ci test-gateway --version
          docker run --rm aviary-testing:ci aviary-conformance --help
      - name: images/hermit (built and run here, pushing is the images job's)
        # hermit spec 8.5: the binary and the juicefs CLI; the catalogue rules run in the image as YYC's CI runs them
        run: |
          ctx=$RUNNER_TEMP/hermit-image
          mkdir -p "$ctx/dist"
          cp dist/hermit "$ctx/dist/"
          docker build -f images/hermit/Dockerfile --build-arg REVISION="$GITHUB_SHA" -t hermit:ci "$ctx"
          docker run --rm hermit:ci --help
          docker run --rm --entrypoint /usr/local/bin/juicefs hermit:ci version
          printf '{"users": ["@example.org"], "admins": []}' > "$RUNNER_TEMP/catalogue.json"
          docker run --rm -v "$RUNNER_TEMP/catalogue.json:/c.json:ro" hermit:ci catalogue-check /c.json
          # with no secrets it refuses to start (exit 78, platform 3.1)
          code=0; docker run --rm hermit:ci serve || code=$?; test "$code" -eq 78
      - name: images/pigeon (built and run here, pushing is the images job's)
        # pigeon spec 3.3: with no secrets it refuses to start (exit 78), naming the variable, never a value
        run: |
          ctx=$RUNNER_TEMP/pigeon-image
          mkdir -p "$ctx/dist"
          cp dist/pigeon "$ctx/dist/"
          docker build -f images/pigeon/Dockerfile --build-arg REVISION="$GITHUB_SHA" -t pigeon:ci "$ctx"
          docker run --rm pigeon:ci --version
          set +e
          out=$(docker run --rm --read-only -e POD_NAME=ci pigeon:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = 78
          grep -q '"name":"PIGEON_TOKEN_MAGPIE"' <<< "$out"
      - name: magpie (glibc, debian trixie + libheif-dev)
        # a docker run of the pinned trixie image + libheif-dev rather than a job container, so it shares this job's
        # dist/ and cargo cache and runs as the runner's uid (.github/ci/build-magpie.sh). Trixie, not bookworm: libheif-rs
        # needs libheif >= 1.17 and bookworm has 1.15 (README "Where this differs")
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          .github/ci/build-magpie.sh rust:1.99.1-trixie@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
          cp target/trixie/release/magpie dist/
      - name: images/magpie (built and run here, pushing is the images job's)
        # the runtime image decodes the HEIC fixture with the release binary: libheif1 and its HEVC plugin are there
        run: |
          ctx=$RUNNER_TEMP/magpie-image
          mkdir -p "$ctx/dist"
          cp dist/magpie "$ctx/dist/"
          docker build -f images/magpie/Dockerfile --build-arg REVISION="$GITHUB_SHA" -t magpie:ci "$ctx"
          docker run --rm magpie:ci --version
          out=$(docker run --rm -v "$PWD/crates/magpie/tests/fixtures/photo-640x480.heic:/photo.heic:ro" magpie:ci check-image /photo.heic)
          echo "$out"
          test "$out" = "image/heic 640x480"
      - name: SHA256SUMS
        run: cd dist && sha256sum * | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  conformance:
    # platform 8 (WP-09): the gateway suite against test-gateway with the contract's own durations (a 3 min hermit
    # outage, a 170 s tools call, the drain by SIGTERM) and the model suite against mock-model, as the static binaries
    # of `build`; the hermit suite and the seeded-fault runs are in-process tests (testing/conformance/tests)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: chmod +x dist/*
      - run: .github/ci/conformance.sh dist "$RUNNER_TEMP/conformance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance/
          if-no-files-found: warn

  paseo-contract:
    # testing/paseo-contract (pigeon spec 18.1): frames validated against every client build in clients.txt, and a
    # running pigeon (crates/pigeon/tests/contract_server.rs) driven by the apps' client package and timeline reducers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PASEO_CONTRACT_CACHE: ${{ github.workspace }}/../paseo-contract-cache
    defaults:
      run:
        working-directory: testing/paseo-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: testing/paseo-contract/package-lock.json
      - name: toolchain (rust-toolchain.toml, exactly)
        working-directory: .
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: the contract server test/pigeon.test.mjs runs
        working-directory: .
        run: cargo test --locked -p pigeon --test contract_server --no-run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # built client protocol packages, keyed by what decides them
          path: ${{ github.workspace }}/../paseo-contract-cache
          key: paseo-contract-${{ hashFiles('testing/paseo-contract/clients.txt', 'testing/paseo-contract/lib/*.mjs', 'testing/paseo-contract/package-lock.json') }}
          restore-keys: paseo-contract-
      - run: npm ci --no-audit --no-fund
      - run: npm test
