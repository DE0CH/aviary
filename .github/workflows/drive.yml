# YYC Drive (drive/, drive/YYC-DRIVE.md; it was DE0CH/yyc-drive). server: clippy and the server's tests (the real
# program on a temporary folder). page: the page's unit tests. edge: the Worker's tests and its bundle (wrangler's dry
# run). image + index: all of it in one image for amd64 and arm64, built by Nix (flake.nix drive-image),
# ghcr.io/de0ch/yyc-drive:<sha12> (the last commit that changed its part, docs/DEPLOY.md; the edge at /srv/edge), only
# when all three passed and the tag is not there yet.
name: drive
on:
  push:
    branches: ['**']  # every branch: the gate waits for it (not tags: jarvis.yml's releases push jarvis-<sha12>)
    paths: [drive/**, deploy/images.json, .github/workflows/drive.yml, flake.nix, flake.lock]
  workflow_dispatch:
  # deploy.yml runs this workflow at a commit whose image is absent (docs/DEPLOY.md: the deploy builds what its commit
  # lacks; the registry is only a cache): `sha` is that commit, and everything here builds and tests it
  workflow_call:
    inputs:
      sha: {type: string, required: true}
concurrency:
  group: drive-${{ inputs.sha && format('deploy-{0}', inputs.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  # every curl in this workflow, its scripts included, reads .github/ci/.curlrc (retries)
  CURL_HOME: ${{ github.workspace }}/.github/ci
  IMAGE: ghcr.io/de0ch/yyc-drive
  NIX_CACHE: s3://de0ch-aviary-nix-cache?endpoint=nbg1.your-objectstorage.com&region=nbg1
  AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
jobs:
  part:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      have: ${{ steps.p.outputs.have }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}", persist-credentials: false, fetch-depth: 0, filter: "blob:none"}
      - id: p
        run: |
          # shellcheck disable=SC2046 # a list of paths
          sha=$(git log -1 --format=%H "${{ inputs.sha || github.sha }}" -- $(jq -r '."yyc-drive".paths | join(" ")' deploy/images.json))
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          token=$(curl -sSf "https://ghcr.io/token?scope=repository:de0ch/yyc-drive:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/de0ch/yyc-drive/manifests/${sha::12}")
          echo "yyc-drive:${sha::12}: HTTP $code"
          if [ "$code" = 200 ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: {run: {working-directory: drive/server}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}"}
      - name: toolchain 1.99.1 with clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy && rustup override set 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {workspaces: drive/server}
      - uses: ./.github/actions/runner-apt
      - name: ffmpeg (the previews' tests)
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends ffmpeg
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked

  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults: {run: {working-directory: drive}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - run: npm install -g pnpm@11.28.11
      - run: pnpm install --frozen-lockfile
      - name: unit tests
        run: pnpm test:unit run

  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: {run: {working-directory: drive/edge}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - run: npm test
      - name: the bundle (with a stand-in for the page)
        run: |
          mkdir -p assets && echo "<html></html>" > assets/index.html && cp _headers assets/
          npx --yes wrangler@4.151.0 deploy --dry-run --outdir /tmp/bundle

  # One image per architecture on its own kind of runner (YYC's app nodes are arm64, its other pools amd64), then one
  # tag naming both; built once per tag, on any branch (the tag names the source)
  image:
    needs: [part, server, page, edge]
    if: needs.part.outputs.have == 'false'
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.part.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}"}
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # single-user: the build itself reads the cache with this job's credentials
          install_options: --no-daemon
          extra_nix_config: |
            extra-substituters = ${{ env.NIX_CACHE }}
            extra-trusted-public-keys = aviary-nix-cache-1:FGNBBLWXtSaJL7163gqCJvlh131qDptMmiy4F4J5NTc=
      - name: build drive-image by Nix (from the cache where it has it; tried again on a failed download)
        uses: ./.github/actions/nix-build
        env:
          # the part's commit: the image's labels
          DRIVE_REVISION: ${{ needs.part.outputs.sha }}
        with:
          installables: .#drive-image
      - name: the image, loaded (drive-image, built above)
        env:
          # the part's commit: the image's labels
          DRIVE_REVISION: ${{ needs.part.outputs.sha }}
        run: |
          set -euo pipefail
          out=$(nix build --impure .#drive-image --no-link --print-out-paths)
          echo "OUT=$out" >> "$GITHUB_ENV"
          "$out" | docker load
      - name: sign what was built and keep it in the cache
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/signing.key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          mapfile -t paths < <(nix path-info --recursive "$OUT")
          nix store sign --key-file "$key" "${paths[@]}"
          rm -f "$key"
          for try in 1 2 3 4 5; do
            nix copy --to "$NIX_CACHE" "${paths[@]}" && break
            echo "::warning title=nix cache::copy try $try of 5 failed"
            [ "$try" = 5 ] && exit 1
            sleep $((try * 10))
          done
      - name: the image serves, draws previews with ffmpeg, and carries the edge
        run: |
          set -euo pipefail
          img=yyc-drive:nix
          test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$img")" = "linux/${{ matrix.arch }}"
          docker run --rm --entrypoint ffmpeg "$img" -hide_banner -version | head -1
          # the edge and the page, read from the image's files (it has no shell, as distroless has none)
          c=$(docker create "$img")
          docker export "$c" | tar -t > "$RUNNER_TEMP/files.txt"
          docker rm "$c" > /dev/null
          for f in srv/edge/wrangler.jsonc srv/edge/package.json srv/edge/assets/index.html srv/edge/assets/_headers \
                   srv/edge/assets/themes/opencloud/ srv/edge/src/ usr/local/bin/yyc-drive; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "the image has no /$f" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/root" && chmod 777 "$RUNNER_TEMP/root"
          docker run -d --name drive -p 18080:8080 -v "$RUNNER_TEMP/root:/data" "$img" --root /data
          for _ in $(seq 30); do curl -fs http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          docker logs drive; docker rm -f drive
      - name: push
        env:
          TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          docker tag yyc-drive:nix "$IMAGE:${TAG::12}-${{ matrix.arch }}"
          docker push -q "$IMAGE:${TAG::12}-${{ matrix.arch }}"

  index:
    needs: [part, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.part.outputs.sha }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: one tag for both architectures
        env:
          TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          tag="${TAG::12}"
          docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
          docker buildx imagetools inspect "$IMAGE:$tag" | grep -E "linux/(amd64|arm64)"
          test "$(docker buildx imagetools inspect "$IMAGE:$tag" | grep -cE "Platform: +linux/(amd64|arm64)")" = 2
