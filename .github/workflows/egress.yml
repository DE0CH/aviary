name: egress
# egress (YYC AI's sandbox gateway: the model and web route) and tools (REST), one image (egress/, egress/CHAT.md):
# typecheck and tests against a real Postgres; egress, the image under test, against aviary's gateway and model
# conformance suites built from this commit (aviary platform spec 17.3); then ghcr.io/de0ch/egress (linux/amd64 and
# linux/arm64), smoke-tested, pushed (any branch) as :<sha12> (the last commit that changed egress/, docs/DEPLOY.md) when
# the tests and both suites pass and the tag is not there yet. The image is built once (job image-amd64) and that same
# image, passed on as an artifact, is what conformance checks and push smoke-tests and pushes (the pushed image id is
# checked against the built one).
on:
  push:
    branches: ['**']  # every branch; not in the gate's list (merge.yml) yet
    paths: ["egress/**", "crates/hermit/fixtures/catalogue-cases.json", "testing/conformance/**", "testing/mock-model/**",
            "deploy/images.json", ".github/workflows/egress.yml", "flake.nix", "flake.lock"]
  workflow_dispatch:
  # deploy.yml runs this workflow at a commit whose image is absent (docs/DEPLOY.md: the deploy builds what its commit
  # lacks; the registry is only a cache): `sha` is that commit, and everything here builds and tests it
  workflow_call:
    inputs:
      sha: {type: string, required: true}

concurrency:
  group: egress-${{ inputs.sha && format('deploy-{0}', inputs.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # every curl in this workflow, its scripts included, reads .github/ci/.curlrc (retries)
  CURL_HOME: ${{ github.workspace }}/.github/ci
  IMAGE: ghcr.io/de0ch/egress
  NIX_CACHE: s3://de0ch-aviary-nix-cache?endpoint=nbg1.your-objectstorage.com&region=nbg1
  AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}

permissions:
  contents: read

jobs:
  part:
    # the image's tag: the last commit that changed egress/ (deploy/images.json "egress"), and whether it exists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      have: ${{ steps.p.outputs.have }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}", persist-credentials: false, fetch-depth: 0, filter: "blob:none"}
      - id: p
        run: |
          # shellcheck disable=SC2046 # a list of paths
          sha=$(git log -1 --format=%H "${{ inputs.sha || github.sha }}" -- $(jq -r '.egress.paths | join(" ")' deploy/images.json))
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          token=$(curl -sSf "https://ghcr.io/token?scope=repository:de0ch/egress:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/de0ch/egress/manifests/${sha::12}")
          echo "egress:${sha::12}: HTTP $code"
          if [ "$code" = 200 ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: claude
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claude" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://claude:dev@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: egress/package-lock.json
      - name: the catalogue cases are hermit's
        # tools validates the staff catalogue by hermit's rules (src/tools/catalogue.ts); the shared cases are a
        # byte-for-byte copy of hermit's, so a change to hermit's rules turns this red until tools follows
        run: cmp crates/hermit/fixtures/catalogue-cases.json egress/test/fixtures/catalogue-cases.json
      - name: typecheck and tests
        working-directory: egress
        # egress's mirror test runs the real pip and npm (python3 -m pip is on the runner image)
        run: |
          python3 -m pip --version
          npm ci
          npm test

  image-amd64:
    # the image, built once by Nix (flake.nix; Deyao, 2026-11-26): conformance checks it and push pushes it, so what
    # ships is what was tested. A build is a lookup in the Nix cache and a build of what is absent, added to it here.
    # CHAT_BUILT_AT stays empty (/version's builtAt is null): a build time would make every build differ
    needs: part
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      id: ${{ steps.load.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}", persist-credentials: false}
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # single-user: the build itself reads the cache with this job's credentials
          install_options: --no-daemon
          extra_nix_config: |
            extra-substituters = ${{ env.NIX_CACHE }}
            extra-trusted-public-keys = aviary-nix-cache-1:FGNBBLWXtSaJL7163gqCJvlh131qDptMmiy4F4J5NTc=
      - name: build the image (Nix, flake.nix egress-image; from the cache where it has it)
        env:
          # the part's commit: CHAT_COMMIT in the image (egress's /version), its labels
          CHAT_COMMIT: ${{ needs.part.outputs.sha }}
        run: |
          set -euo pipefail
          nix build --impure .#egress-image --no-link -L --fallback --option connect-timeout 30 --option download-attempts 5
          out=$(nix build --impure .#egress-image --no-link --print-out-paths)
          echo "OUT=$out" >> "$GITHUB_ENV"
          "$out" | docker load
          docker tag egress:nix egress:test
          docker rmi egress:nix
          docker save -o "$RUNNER_TEMP/egress-image.tar" egress:test
      - name: sign what was built and keep it in the cache
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/signing.key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          mapfile -t paths < <(nix path-info --recursive "$OUT")
          nix store sign --key-file "$key" "${paths[@]}"
          rm -f "$key"
          for try in 1 2 3 4 5; do
            nix copy --to "$NIX_CACHE" "${paths[@]}" && break
            echo "::warning title=nix cache::copy try $try of 5 failed"
            [ "$try" = 5 ] && exit 1
            sleep $((try * 10))
          done
      - name: image id
        id: load
        run: |
          set -euo pipefail
          id=$(docker image inspect egress:test --format '{{.Id}}')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "egress image $id" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egress-image
          path: ${{ runner.temp }}/egress-image.tar
          retention-days: 1
          compression-level: 1

  conformance:
    # egress as a sandbox gateway, checked from outside (aviary platform spec 8.2, 8.3, 17.3): the image built once
    # with test configs (egress/test/conformance/), the suites' fakes at the fixed names, the drain last. The suites
    # (aviary-conformance, mock-model) are built from this very commit, so egress and the contract it serves are
    # checked together
    runs-on: ubuntu-24.04
    needs: [image-amd64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}"}
      - name: toolchain (rust-toolchain.toml, exactly)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {shared-key: egress-conformance}
      - name: aviary-conformance and mock-model of this commit
        run: |
          cargo build --locked --release -p aviary-conformance -p mock-model
          mkdir -p conformance-bin
          cp target/release/aviary-conformance target/release/mock-model conformance-bin/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: egress-image
          path: ${{ runner.temp }}
      - name: load the image under test
        run: |
          set -euo pipefail
          docker load -q -i "$RUNNER_TEMP/egress-image.tar"
          test "$(docker image inspect egress:test --format '{{.Id}}')" = "${{ needs.image-amd64.outputs.id }}"
      - name: aviary-conformance gateway and model
        run: egress/test/conformance/run.sh egress:test conformance-bin "$RUNNER_TEMP/conformance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: egress-conformance  # not ci.yml's `conformance`: a deploy run may call both
          path: ${{ runner.temp }}/conformance

  image-arm64:
    # the image for linux/arm64 (YYC's cluster's workers are ARM), built by Nix natively on an ARM runner from the same
    # commit and smoke-tested there; push puts it beside the amd64 image under one multi-platform tag. The code is plain
    # JavaScript (no native modules), so conformance on amd64 covers it
    needs: part
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.sha || github.sha }}", persist-credentials: false}
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # single-user: the build itself reads the cache with this job's credentials
          install_options: --no-daemon
          extra_nix_config: |
            extra-substituters = ${{ env.NIX_CACHE }}
            extra-trusted-public-keys = aviary-nix-cache-1:FGNBBLWXtSaJL7163gqCJvlh131qDptMmiy4F4J5NTc=
      - name: build the image (Nix, flake.nix egress-image; from the cache where it has it)
        env:
          # the part's commit: CHAT_COMMIT in the image (egress's /version), its labels
          CHAT_COMMIT: ${{ needs.part.outputs.sha }}
        run: |
          set -euo pipefail
          nix build --impure .#egress-image --no-link -L --fallback --option connect-timeout 30 --option download-attempts 5
          out=$(nix build --impure .#egress-image --no-link --print-out-paths)
          echo "OUT=$out" >> "$GITHUB_ENV"
          "$out" | docker load
          docker tag egress:nix egress:test-arm64
          docker rmi egress:nix
          docker save -o "$RUNNER_TEMP/egress-image-arm64.tar" egress:test-arm64
      - name: sign what was built and keep it in the cache
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/signing.key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          mapfile -t paths < <(nix path-info --recursive "$OUT")
          nix store sign --key-file "$key" "${paths[@]}"
          rm -f "$key"
          for try in 1 2 3 4 5; do
            nix copy --to "$NIX_CACHE" "${paths[@]}" && break
            echo "::warning title=nix cache::copy try $try of 5 failed"
            [ "$try" = 5 ] && exit 1
            sleep $((try * 10))
          done
      - name: smoke test
        run: |
          set -euo pipefail
          test "$(docker image inspect egress:test-arm64 --format '{{.Architecture}}')" = arm64
          docker run --rm --entrypoint sh egress:test-arm64 -c 'test "$(id -u)" = 1000 && test -s egress-allowlist/allow.txt && node -e "require(\"pg\")"'
          if docker run --rm egress:test-arm64 nope; then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egress-image-arm64
          path: ${{ runner.temp }}/egress-image-arm64.tar
          retention-days: 1
          compression-level: 1

  push:
    # once per tag, on any branch (as ci's images: the yyc check and the deploy find it by its tag): the tested image
    # retagged (no rebuild)
    if: needs.part.outputs.have == 'false'
    runs-on: ubuntu-24.04
    needs: [part, test, image-amd64, image-arm64, conformance]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: egress-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: egress-image-arm64
          path: ${{ runner.temp }}/arm64
      - name: load the image conformance checked
        run: |
          set -euo pipefail
          docker load -q -i "$RUNNER_TEMP/egress-image.tar"
          test "$(docker image inspect egress:test --format '{{.Id}}')" = "${{ needs.image-amd64.outputs.id }}"
      - name: smoke test
        run: |
          set -euo pipefail
          docker image inspect egress:test --format '{{.Size}}' | awk '{printf "egress:test unpacked: %.0f MB\n", $1/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint sh egress:test -c 'test "$(id -u)" = 1000 && test -s egress-allowlist/allow.txt'
          # an unknown role refuses to start (the role is the first argument)
          if docker run --rm egress:test nope; then exit 1; fi
      - name: log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: push the image
        env:
          TAG: ${{ env.IMAGE }}:${{ needs.part.outputs.sha }}
        run: |
          set -euo pipefail
          t=${TAG::${#IMAGE}+13}  # ghcr.io/de0ch/egress:<sha12>
          docker load -q -i "$RUNNER_TEMP/arm64/egress-image-arm64.tar"
          docker tag egress:test "$t-amd64"
          docker push -q "$t-amd64"
          docker tag egress:test-arm64 "$t-arm64"
          docker push -q "$t-arm64"
          docker buildx imagetools create -t "$t" "$t-amd64" "$t-arm64"
          test "$(docker image inspect "$t-amd64" --format '{{.Id}}')" = "${{ needs.image-amd64.outputs.id }}"
          amd64=$(docker image inspect "$t-amd64" --format '{{index .RepoDigests 0}}')
          # the index's amd64 entry is the pushed tested image
          docker buildx imagetools inspect "$t" --raw \
            | jq -e --arg d "${amd64#*@}" 'any(.manifests[]; .platform.architecture == "amd64" and .digest == $d)' >/dev/null
          echo "egress image ${{ needs.image-amd64.outputs.id }} = $amd64 (amd64), index $t" | tee -a "$GITHUB_STEP_SUMMARY"
