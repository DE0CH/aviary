# Adds Paseo client builds to testing/paseo-contract/clients.txt (pigeon spec 17.1 step 9, 18.1). The app's workflows
# in DE0CH/claudecodeui send a repository_dispatch of type paseo-client after each web bundle build and each TestFlight
# upload, with {"commit": "<40 hex>", "kind": "web"|"ios"}, or with a list of builds in one dispatch:
# {"clients": [{"commit": …, "kind": …}, …]} (pigeon-app seeds every pre-Paseo ui image this way; those are listed as
# web-legacy). Each line is inserted at its place by commit time, the newest client's JSON Schema is re-exported, and
# the contract suite runs against the new list BEFORE anything is pushed.
#
# There is no concurrency group: GitHub keeps one pending run per group and cancels the one already pending when
# another arrives, which would drop builds without a trace. Runs go in parallel instead, and whichever pushes first
# wins; a run whose tested list went stale (testing/paseo-contract changed on main after it started) dispatches this
# workflow again with the same builds, on the new main (input `attempt`, up to 20). Every dispatch therefore ends with
# its builds listed, or with a red run.
#
# Trust: the build job runs code from the client commits (their zod-aot generators, and the suite imports their
# packages), so it holds a read-only token and no credentials in its checkout; it hands the change on as an artifact
# (a patch). The land job runs no client code: a fresh checkout of main, the patch applied (it may touch only
# testing/paseo-contract), git hooks off, a plain push (never forced). A push made with this workflow's token starts no
# workflow, so the land job then starts ci.yml on main itself: pigeon's Rust schema tests run against a new newest
# client's schema/<commit>.json and a break is a red check on main (pigeon spec 18.1).
name: clients

on:
  repository_dispatch:
    types: [paseo-client]
  workflow_dispatch:
    inputs:
      clients:
        description: "builds to add: <claudecodeui commit, 40 hex>:<web|ios>, space-separated"
        required: true
      attempt:
        description: "set by a re-dispatch after a stale list"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      clients: ${{ steps.list.outputs.clients }}
      attempt: ${{ steps.list.outputs.attempt }}
      changed: ${{ steps.diff.outputs.changed }}
    env:
      PASEO_CONTRACT_CACHE: ${{ github.workspace }}/../paseo-contract-cache
    defaults:
      run:
        working-directory: testing/paseo-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: testing/paseo-contract/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../paseo-contract-cache
          key: paseo-contract-clients-${{ github.run_id }}
          restore-keys: paseo-contract-
      - name: the builds to add
        id: list
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT: ${{ inputs.clients }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            list=$INPUT
          else
            list=$(jq -r 'if has("clients") then .clients[] else . end | "\(.commit):\(.kind)"' <<<"$PAYLOAD" | tr '\n' ' ')
          fi
          list=$(echo $list)
          [ -n "$list" ] || { echo "no builds given" >&2; exit 1; }
          for item in $list; do
            [[ "$item" =~ ^[0-9a-f]{40}:(web|ios)$ ]] || { echo "not <40 hex>:<web|ios>: $item" >&2; exit 1; }
          done
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || { echo "bad attempt $ATTEMPT" >&2; exit 1; }
          echo "clients=$list" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "builds (attempt $ATTEMPT): $list"
      - run: npm ci --no-audit --no-fund
      - name: toolchain (rust-toolchain.toml, exactly)
        working-directory: .
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: the contract server test/pigeon.test.mjs runs (the new builds drive a running pigeon)
        working-directory: .
        run: cargo test --locked -p pigeon --test contract_server --no-run
      - name: the commits are on claudecodeui main
        env:
          CLIENTS: ${{ steps.list.outputs.clients }}
        run: |
          git init -q --bare "$RUNNER_TEMP/ccui-history"
          # every commit of main, no trees or blobs
          git -C "$RUNNER_TEMP/ccui-history" fetch -q --filter=tree:0 https://github.com/DE0CH/claudecodeui.git main
          for item in $CLIENTS; do
            git -C "$RUNNER_TEMP/ccui-history" merge-base --is-ancestor "${item%%:*}" FETCH_HEAD \
              || { echo "claudecodeui ${item%%:*} is not on main" >&2; exit 1; }
          done
      - name: insert the builds (the script checks each hash, kind and that the commit is a client build)
        env:
          CLIENTS: ${{ steps.list.outputs.clients }}
        run: node append-client.mjs $(for item in $CLIENTS; do echo "${item%%:*} ${item##*:}"; done)
      - name: export the newest client's schema
        run: node export-schema.mjs
      - name: contract suite against the new client list
        run: npm test
      - name: the change, as a patch
        id: diff
        run: |
          mkdir -p "$RUNNER_TEMP/change"
          git rev-parse HEAD > "$RUNNER_TEMP/change/base"
          git add -A clients.txt schema
          git diff --cached --binary > "$RUNNER_TEMP/change/change.patch"
          if [ -s "$RUNNER_TEMP/change/change.patch" ]; then echo "changed=true"; else echo "changed=false"; fi >> "$GITHUB_OUTPUT"
          git diff --cached --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: clients-change
          path: ${{ runner.temp }}/change
          retention-days: 7

  land:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clients-change
          path: ${{ runner.temp }}/change
      - name: push to main
        id: land
        env:
          CLIENTS: ${{ needs.build.outputs.clients }}
          ATTEMPT: ${{ needs.build.outputs.attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # land.sh checks out other commits: run a copy of main's, outside the work tree
          cp testing/paseo-contract/ci/land.sh "$RUNNER_TEMP/land.sh"
          set +e
          "$RUNNER_TEMP/land.sh" "$RUNNER_TEMP/change/change.patch" "$(cat "$RUNNER_TEMP/change/base")" \
            "paseo-contract: clients $(for item in $CLIENTS; do printf '%s ' "${item:0:12}${item:40}"; done | sed 's/ $//')"
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            if [ "$ATTEMPT" -ge 20 ]; then
              echo "the client list went stale 20 times; dispatch these builds again: $CLIENTS" >&2
              exit 1
            fi
            gh workflow run clients.yml --repo "$GITHUB_REPOSITORY" --ref main -f clients="$CLIENTS" -f attempt=$((ATTEMPT + 1))
            echo "::notice::the tested client list went stale; dispatched attempt $((ATTEMPT + 1)) with the same builds"
            echo "landed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "landed=true" >> "$GITHUB_OUTPUT"
      - name: run ci on the new main (a push made with this token starts no workflow)
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
